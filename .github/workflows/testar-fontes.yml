
name: Testar fontes e recolher eventos

on:
  workflow_dispatch:
  push:
    paths:
      - "fontes.py"
      - "testar_fontes.py"
      - "recolher_eventos.py"
      - "requirements.txt"
      - ".github/workflows/testar-fontes.yml"

# Permite ao workflow guardar ficheiros no repositório.
permissions:
  contents: write

jobs:
  testar-e-recolher:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar fontes
        run: python testar_fontes.py

      - name: Recolher eventos
        run: python recolher_eventos.py

      - name: Guardar eventos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add eventos.json

          if git diff --cached --quiet; then
            echo "Não existem alterações aos eventos."
          else
            git commit -m "Atualizar eventos recolhidos"
            git push
          fi
